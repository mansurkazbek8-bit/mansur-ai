# Mansur AI — сайт в nginx. setup.sh подставляет домен вместо DOMAIN, certbot добавляет HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    root /var/www/mansur-ai/server/public;
    index index.php;
    charset utf-8;

    # фон оформления — фото/видео до 30 МБ
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # установщик Windows-приложения и картинки отдаются напрямую
    location /downloads/ { add_header Cache-Control "public, max-age=3600"; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|gif|svg|woff2?)$ { expires 7d; access_log off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # нейросеть на бесплатном тарифе может думать несколько минут (шаги ИИ-агента)
        fastcgi_read_timeout 330s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
